; ================================================================
;  CALIBRATION settings - judge the judge
;  python kit.py run calibrate.ini
;  12 replies already labelled by the product owner (human: good/bad).
;  Only the empathy rubric runs. Goal: make the judge agree with her.
; ================================================================

[app]
name = Calibration - Empathy and tone judge
prompt = app/lane_prompt.txt
policy = app/lane_policy.txt
data =

[tests]
cases = tests/calibration.txt

[rubrics]
files = rubrics/empathy.txt
repeats = 1

[checks]
rules = no
answer_relevancy = 0
faithfulness = 0
penalize_invented_claims = no
hallucination = 0
toxicity = 0
bias = 0
pii_leakage = 0

[models]
app_model = gpt-4.1-mini
judge_model = gpt-4.1-mini
max_parallel = 4
