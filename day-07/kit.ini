; ================================================================
;  EVAL KIT v3 settings - change these, save, run again
;  Run with another settings file:  python kit.py run calibrate.ini
; ================================================================

[app]
name = Lane - Harbour & Lane customer assistant
prompt = app/lane_prompt.txt
policy = app/lane_policy.txt
data = app/lane_orders.txt

[tests]
cases = tests/cases.txt

[rubrics]
; Day 6: your own marking schemes, scored by G-Eval. Comma separated, or leave empty.
files = rubrics/empathy.txt, rubrics/follows_expected.txt
; run each rubric this many times and report the spread (1 = once)
repeats = 1

[checks]
rules = yes
; Day 4 + 5 built-in checks (0 = off). Off today so you can focus on your rubrics.
answer_relevancy = 0
faithfulness = 0
penalize_invented_claims = no
hallucination = 0
toxicity = 0
bias = 0
pii_leakage = 0

[models]
app_model = gpt-4.1-mini
judge_model = gpt-4.1-mini
; lower this (e.g. 2) if you see rate-limit errors
max_parallel = 4
