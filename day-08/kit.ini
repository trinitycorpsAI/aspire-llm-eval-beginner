; ================================================================
;  EVAL KIT v5 settings for the Lane labs (Day 8: RAG)
;  Your own project uses project/project.ini after 'python kit.py import'.
; ================================================================

[app]
name = Lane - Harbour & Lane customer assistant (RAG)
prompt = app/lane_prompt.txt
policy = app/lane_policy.txt
data = app/lane_orders.txt

[tests]
cases = tests/cases.txt

[rag]
; the app answers from documents it retrieves for each question
enabled = yes
kb = kb/lane_kb.txt
; how many documents the retriever passes to the app
top_k = 1

[rubrics]
files = rubrics/answer_correctness.txt
repeats = 1

[checks]
rules = yes
; RAG checks: precision and recall need a reference: line on the case
context_precision = 0.7
context_recall = 0.7
context_relevancy = 0
; is the reply backed by what was retrieved?
faithfulness = 0.7
penalize_invented_claims = no
answer_relevancy = 0
hallucination = 0
toxicity = 0
bias = 0
pii_leakage = 0

[gate]
min_pass_rate = 0.8
block_tags = personal-data, credentials

[models]
app_model = gpt-4.1-mini
judge_model = gpt-4.1-mini
max_parallel = 4
