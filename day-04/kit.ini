; ================================================================
;  EVAL KIT settings - change these, save, run again
; ================================================================

[app]
; the AI application under test: a name for the report, its instructions and its policy
name = Lane - Harbour & Lane customer assistant
prompt = app/lane_prompt_risky.txt
policy = app/lane_policy.txt

[tests]
cases = tests/cases.txt
; testing a different app? point the three lines above and this line at its files, e.g.
;   name   = ClaimBuddy
;   prompt = apps/insurance/prompt.txt
;   policy = apps/insurance/policy.txt
;   cases  = tests/insurance_cases.txt

[checks]
; rules from your test cases (must_contain / must_not_contain)
rules = yes
; meaning checks, scored by an AI judge - pass mark between 0 and 1
answer_relevancy = 0.7
faithfulness = 0.7
; yes = claims the policy never mentions also lose faithfulness marks
penalize_invented_claims = yes

[models]
app_model = gpt-4.1-mini
judge_model = gpt-4.1-mini
